aid: 280-earth
name: 280 Earth
description: '280 Earth is a direct air capture (DAC) company that permanently removes
  carbon dioxide from the atmosphere. Originally launched in 2018 inside X, the Alphabet
  moonshot factory, and spun out as an independent company in 2022, it is backed by
  Sergey Brin, Builders VC and a $50M Series B. Its proprietary sorbent moves through
  a gravity-fed dual-chamber system that continuously cycles material between capturing
  and releasing CO2, running on low-grade industrial waste heat or clean electricity
  and producing fresh water as a byproduct. Its first pilot plant, in The Dalles, Oregon,
  captures 500 tons of CO2 per year on a site sized for more than 20,000 tons per
  year at full build-out, and underpins a $40M offtake agreement with the Frontier
  carbon removal buyer consortium (Google, Meta, Stripe, Shopify and others). 280 Earth
  is a hardware and carbon-removal operator; as of this profiling pass it publishes
  no public developer surface, API, or machine-readable contract.'
